<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-labelledby="pithy-wordmark-light-title">
  <title id="pithy-wordmark-light-title">Pithy</title>
  <style>
    .wordmark {
      font-family: 'Geist', 'Geist Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 120px;
      letter-spacing: -0.05em;
      fill: #111111;
    }
    .period { fill: #D4A017; }
  </style>
  <text x="0" y="110" class="wordmark">pithy<tspan class="period">.</tspan></text>
</svg>
