<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="pithy-social-title">
  <title id="pithy-social-title">Pithy social icon</title>
  <style>
    .bg { fill: #111111; }
    .glyph {
      font-family: 'Geist', 'Geist Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 600px;
      letter-spacing: -0.04em;
      fill: #FAFAF6;
    }
    .period { fill: #D4A017; }
  </style>
  <rect class="bg" width="1024" height="1024" rx="154"/>
  <text x="512" y="700" class="glyph" text-anchor="middle">p<tspan class="period">.</tspan></text>
</svg>
