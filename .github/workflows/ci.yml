name: CI

# Skip CI for changes that can't affect build/typecheck/test/lint. `paths-ignore` skips a run only when
# EVERY changed file matches, so a mixed code+docs change still runs.
#
# `LICENSE` used to be on this list and no longer is: the `verify` job now reconciles every LICENSE
# file against the licence its package declares, so a licence-only change is precisely the one that
# must run CI rather than skip it.
#
# If `CI` is ever made a required
# status check (needs branch protection — a public/Pro feature), a docs-only PR would skip the job and
# report no status; add an always-pass guard job then. Not a concern while the repo is unprotected.
#
# **No `push` trigger on `main`.** A merge re-ran the identical tree the pull request had already
# proved, for eight jobs' worth of billable minutes — and billing counts the sum of job durations, so
# a run whose tests take fifteen seconds still pays checkout, Bun and install eight times. What the
# second run genuinely caught is a semantic conflict between two pull requests that each passed alone.
# That is real, and it is what the nightly below is for: it runs the full matrix against `main` on a
# schedule, so the class is still caught, once a day instead of once a merge.
on:
  # Nightly, against whatever `main` holds. The one run that is not narrowed by `plan`, because there
  # is no pull request to narrow against and a skipped package would have no green result to fall back
  # on.
  schedule:
    - cron: "17 4 * * *"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
      - ".vscode/**"
      - ".husky/**"
      - ".gitignore"
      - ".editorconfig"
  # Manual full run, ignoring the affected calculation — the escape hatch for "test everything now".
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What to test, and how to divide it. Every test job hangs off this one output.
  #
  # A PR tests only what it affected. Measured on this repo: a one-package change resolves to 2
  # packages (the package plus `cli`, which depends on all of them) — 43s of test work against 191s
  # for the full set. A `core` change correctly cascades to all 16, which is the intended contract.
  #
  # The nightly always runs everything. `main` is the baseline every PR narrows against, so it is the
  # one place a narrowed run would be self-defeating: whatever it skipped would have no green result
  # to fall back on, and no warm turbo cache for the next PR to restore.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      any: ${{ steps.plan.outputs.any }}
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      dirs: ${{ steps.plan.outputs.dirs }}
      nodeVersions: ${{ steps.node.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # `--affected` diffs against a merge base, which does not exist in a shallow clone.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Node 24 is forward compatibility, not a gate: `CLAUDE.md` sets a Node 22 LTS floor, so 22 is
      # what an adopter must work on and 24 is what we would like to keep working. Running both on
      # every pull request paid a whole extra job for the second answer, every time. The nightly runs
      # both; a pull request runs the floor.
      - name: Node versions to check
        id: node
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'versions=["22"]' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["22","24"]' >> "$GITHUB_OUTPUT"
          fi

      - name: Plan the test matrix
        id: plan
        run: |
          set -euo pipefail
          # No `bun install` here: a dry run reads the workspace manifests and nothing else, and this
          # job is pure latency in front of every test job. `turbo` is pinned to the version the repo
          # already declares, so this cannot drift from what the test jobs run.
          turbo_version="$(jq -r '.devDependencies.turbo' package.json | tr -d '^~')"

          # Files that belong to no package but change how every package builds or tests. `--affected`
          # maps a changed file to the package that owns it, so these resolve to NOTHING and would
          # skip the entire suite. Verified: a `turbo.jsonc` edit does cascade to all 16, but an edit
          # to `bun.lock` or `.github/**` alone yields zero affected packages. The lockfile is the
          # dangerous one — it silently re-resolves every dependency — and `.github/**` is what makes
          # a change to CI itself get tested by the CI it changes.
          GLOBAL_PATHS='^(bun\.lock|package\.json|turbo\.jsonc|biome\.jsonc|tsconfig[^/]*\.json|\.github/)'

          scope=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Diff from the merge base, not the base branch tip. On a `pull_request` event the
            # checkout is a merge commit, so the merge base is exactly "what this PR changed".
            # `base.sha` is the fallback: it can lag if `main` moved, which over-counts affected
            # packages — the safe direction.
            base="$(git merge-base "origin/${{ github.base_ref }}" HEAD 2>/dev/null || echo "${{ github.event.pull_request.base.sha }}")"
            changed="$(git diff --name-only "${base}" HEAD)"

            # The other blind spot, and the one that keeps coming back. `--affected` maps a changed
            # file to its owning package and that package's DEPENDENTS — so a test that asserts about
            # ANOTHER package's files is invisible to it. `packages/cli` is no dependent of
            # `packages/leaderboard`, so editing `packages/leaderboard/pithy.manifest.json` planned
            # `leaderboard, multiplayer` and the manifest-width sweep in the CLI never ran (#173).
            # #148 was the same defect on `templates/`, and this line used to be a hardcoded
            # `^templates/` — which is precisely why #173 was found on the branch that fixed #148.
            #
            # So nothing is hardcoded now. `crossPackageReads.ts` derives the mapping from the tests
            # themselves on every run: it resolves the relative-path literals in each package's test
            # files and reports the ones that land outside their own package. Add a cross-package read
            # tomorrow and it is planned tomorrow, with no edit here. Run it with no arguments to see
            # the record; `packages/cli/src/ci/crossPackageReads.test.ts` holds it to a written-down set
            # so a NEW kind of read is a deliberate act rather than a silent one.
            #
            # Not turbo's own knobs, and this was measured rather than assumed on turbo 2.10.7:
            # `inputs: ["$TURBO_ROOT$/packages/*/pithy.manifest.json"]` on the CLI's `test:node` leaves
            # the affected set byte-identical, because `--affected` never reads task inputs; and
            # `globalDependencies` only reaches files no package owns — `templates/**` there works but
            # escalates to all 23 packages, and `packages/*/pithy.manifest.json` is ignored outright.
            #
            # Assigned to a variable before `mapfile` rather than read from a process substitution:
            # `pipefail` does not see inside a `< <(…)`, so a crashing script would hand back an empty
            # array and fall through to plain `--affected` — planning less, quietly, which is the exact
            # failure mode this closes. This way it fails the step.
            reads_out="$(printf '%s\n' "$changed" | bun .github/scripts/crossPackageReads.ts --filters)"
            reads=()
            if [ -n "$reads_out" ]; then mapfile -t reads <<< "$reads_out"; fi

            if grep -qE "$GLOBAL_PATHS" <<< "$changed"; then
              echo "Full run: this PR touches a repo-wide file, which no package owns."
              grep -E "$GLOBAL_PATHS" <<< "$changed" | sed 's/^/  /'
            elif [ "${#reads[@]}" -gt 0 ]; then
              # Affected, PLUS the packages that assert about the changed paths. Spelled as two
              # filters rather than `--affected --filter=...`, because turbo INTERSECTS those two —
              # measured: `--affected --filter=@pithy-sh/cli` on a templates-only diff plans zero
              # packages, the same silence this branch exists to end. Filters union with each other,
              # so the affected set has to be written as one. It is the same set: `--filter=...[base]`
              # and `--affected` returned identical package lists on both a templates-only diff and a
              # `core` diff that cascades to all 21.
              echo "Affected since ${base}, plus ${reads[*]} — these assert about paths this PR changed."
              scope=("--filter=...[${base}]" "${reads[@]}")
            else
              echo "Affected since ${base}"
              export TURBO_SCM_BASE="${base}"
              scope=(--affected)
            fi
          else
            echo "Full run (${{ github.event_name }}): every package."
          fi

          # Piped, not staged through a file: `pipefail` still fails the step if turbo fails, and
          # nothing is left behind in the workspace.
          plan="$(bunx "turbo@${turbo_version}" run test:node test:workers "${scope[@]}" --dry=json | bun .github/scripts/planShards.ts)"
          echo "$plan" | jq

          {
            echo "any=$(jq -r '.any' <<< "$plan")"
            echo "count=$(jq -r '.count' <<< "$plan")"
            echo "dirs=$(jq -r '.dirs' <<< "$plan")"
            echo "shards=$(jq -c '.shards' <<< "$plan")"
          } >> "$GITHUB_OUTPUT"

          echo "### $(jq -r '.count' <<< "$plan") package(s) to test across $(jq -r '.shards | length' <<< "$plan") shard(s)" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.shards[] | "- shard \(.id): \(.label)"' <<< "$plan" >> "$GITHUB_STEP_SUMMARY"

  # The fast gate: lint, typecheck, build. Deliberately NOT affected-filtered — these are whole-repo
  # checks, and with the turbo cache restored from `main` the unchanged packages are cache hits, so
  # scoping them would save little and could hide a cross-package type break.
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Restore turbo's local task cache so unchanged typecheck/build work is reused.
      # GitHub cache keys are immutable, so the sha suffix saves fresh each run; restore-keys
      # warms from the latest prior cache (this branch, then main).
      - name: Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-verify-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-verify-${{ github.ref_name }}-
            turbo-verify-main-

      # CI sets CI=true, so `bun install` freezes the lockfile (no --frozen-lockfile needed).
      - name: Install
        run: bun install

      - name: Lint + format (Biome)
        run: bunx biome ci .

      # Whole-repo by design, like the two steps around it. The three layers it reconciles —
      # a package's `license` field, its LICENSE file, and every header under its src — are only
      # consistent as a set, so checking an affected subset would miss exactly the drift it exists
      # to catch.
      - name: License headers
        run: bun scripts/license-headers.ts --check

      # Whole-repo, and for a reason the two steps around it share: a stamped version that has drifted
      # from the package.json it came from is worse than reporting none, because a customer acts on it —
      # deciding not to upgrade against a version that is a lie. The generated constants are committed so
      # typecheck and consumers get them with no build step, which is exactly what makes staleness
      # possible and this check necessary.
      - name: Stamped package versions
        run: bun scripts/stampVersions.ts --check

      # Whole-repo for the same reason as the step above, and learned the same way. Two capabilities
      # in flight at once each took migration order 1200 from the same `NEXT_FREE_ORDER`; because both
      # branches bumped the constant to the same value, git merged the registry with no conflict and
      # the collision only existed once both were on one tree. `pithy migrate` throws
      # `duplicate migration order` for any project composing such a pair.
      #
      # The test itself is sound — it scans every package's source rather than trusting the registry —
      # but it lives in `@pithy-sh/cli` and so only ran when the affected calculation reached that
      # package. That happens today only because every capability declares itself in the CLI's
      # manifest, which is a load-bearing coincidence rather than a guarantee: a capability landing
      # without that wiring, or declaring its order outside `capability.ts`, would skip the check
      # entirely. Running it here makes it unconditional, and it costs a fifth of a second.
      - name: Migration orders
        working-directory: packages/cli
        run: bunx vitest run src/migrations/orders.test.ts

      # `files` does not fail on a missing path. Pack the CLI with lifecycle scripts disabled and the
      # starter template is simply absent from the tarball — silently, exit 0 — which is the defect
      # `prepack` was added to close, reappearing through the one door `prepack` cannot watch. No script
      # our manifest declares can run during a pack that refuses to run scripts, so the post-condition
      # has to sit on the artefact instead. This is it: pack, then hold the tarball to the git index.
      # Whatever publishes runs the same check on the file it is about to push.
      - name: Pack the CLI
        working-directory: packages/cli
        run: bun run pack:verify

      - name: Typecheck
        run: bun run typecheck

      # Nothing in the test run consumes `dist/` (packages import each other's source), so this is
      # purely about proving tsc emit and dts generation still work for publishing.
      - name: Build
        run: bun run build

  # The test suites, both projects, sharded across runners.
  #
  # The shard count and membership come from `plan`, so a small PR gets one runner and a full run
  # gets four — the previous fixed 4-way matrix made every PR pay four runners' worth of checkout
  # and install to run a couple of packages.
  #
  # Sharding is the only parallelism lever that works here. GitHub-hosted runners for a private
  # repo are 2-core, and the workers suites run their test FILES serially inside one Miniflare per
  # package (measured: 6 files, 21.0s cumulative, 22.1s wall) — so a package is the smallest unit
  # that can be parallelized at all, and more runners is the only way to go wider.
  test:
    name: Tests (${{ matrix.label }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Per-shard cache key: GitHub cache keys are immutable and first-writer-wins, so shards
      # sharing one key would leave all but one silently unable to save.
      - name: Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-test-${{ matrix.id }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ matrix.id }}-${{ github.ref_name }}-
            turbo-test-${{ matrix.id }}-main-

      - name: Install
        run: bun install

      - name: Test
        env:
          # Via env, not interpolated into the script: an expression spliced into `run:` is a
          # script-injection seam even when the values are repo-controlled package names.
          FILTERS: ${{ matrix.filters }}
        run: |
          set -euo pipefail
          # $FILTERS is deliberately unquoted — it is a list of `--filter=` arguments.
          # --concurrency=2 matches the runner's core count. Each workerd instance is heavy;
          # oversubscribing it is what times out `beforeAll` hooks (see turbo.jsonc).
          #
          # `--continue=always` here and not only in the root script, because this step calls turbo
          # directly and so reads none of them (#333 fixed `package.json`; this is where CI runs).
          # Turbo's default cancels the shard's remaining packages on the first failure, and a shard
          # holds several — so a red run named one package and said nothing whatever about the others
          # it never started. The absence of a result read as a pass. That is the whole defect, and it
          # lived in the half a reader was actually looking at.
          # shellcheck disable=SC2086
          bunx turbo run test:node test:workers --concurrency=2 --continue=always $FILTERS

  # Verify the cross-runtime promise: the packages run on the Node versions we support
  # (22 LTS floor + 24 current), not just under Bun.
  #
  # Node suites ONLY. The workers suites execute inside workerd — the host runtime that launched
  # vitest has no bearing on what they exercise, so running them here proved nothing about Node
  # compatibility while costing this job the majority of its wall clock.
  test-node:
    name: Node ${{ matrix.node }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.plan.outputs.nodeVersions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: bun install

      # Run each package's own `test:node` script under Node (not Bun) via `node --run`.
      # Turbo can't do this — it launches scripts through Bun; the runtime is the launcher's
      # choice, so this job invokes the script with node directly. Directories come from `plan`
      # rather than a `packages/*` glob, which is what scopes this job to the affected set.
      #
      # The loop continues past a failure and fails at the end, for the reason `--continue=always`
      # exists on every turbo call in this file: `set -e` aborted this loop on the first red package,
      # so every package after it in `$DIRS` produced no result and none of them was named. This job
      # is turbo-free, so no flag could reach it — the fix had to be written here or not at all.
      # Every package runs; the summary names every one that failed.
      - name: Test under Node ${{ matrix.node }}
        env:
          DIRS: ${{ needs.plan.outputs.dirs }}
        run: |
          set -euo pipefail
          ran=0
          failed=()
          for dir in $DIRS; do
            # Gate on the script this job actually invokes, not on a config file that implies it.
            jq -e '.scripts["test:node"]' "${dir}/package.json" > /dev/null || continue
            echo "::group::${dir} (Node ${{ matrix.node }})"
            # `if`, not a bare call: a command tested by `if` is exempt from errexit, which is what
            # lets the loop reach the next package.
            if ( cd "$dir" && node --run test:node ); then :; else failed+=("$dir"); fi
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then echo "No affected package defines vitest.config.ts"; exit 1; fi
          echo "Ran ${ran} package(s) under Node ${{ matrix.node }}."
          if [ "${#failed[@]}" -gt 0 ]; then
            printf '::error::Failed under Node %s: %s\n' "${{ matrix.node }}" "${failed[*]}"
            exit 1
          fi
