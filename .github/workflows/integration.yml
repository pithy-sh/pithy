name: Integration (live Cloudflare)

# Live integration tests hit a REAL Cloudflare account — the control-plane paths that cannot be
# mocked. The secrets deploy E2E (PITHY_LIVE_DEPLOY=1) goes further: it deploys, exercises, then
# DELETES the real-named `pithy-secrets-<env>` managers, databases, and master keys. So this is a
# release gate only — never per-PR — and the account it targets MUST be a dedicated test account,
# never one holding real secrets (the E2E tears those resources down).
#
# Trigger it by hand when cutting a release (workflow_dispatch), or automatically on a release tag.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Never cancel a run mid-deploy — an interrupted deploy/teardown could orphan Cloudflare resources.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-24.04
    # Gated on the "E2E Integration Testing" GitHub environment — its secrets (CLOUDFLARE_*,
    # SECRETS_STORE_ID) and any required-reviewer protection apply to this job.
    environment: "E2E Integration Testing"
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SECRETS_STORE_ID: ${{ secrets.SECRETS_STORE_ID }}
      # Opt in to the deploy E2E (provision → write/rotate/audit → teardown). The `live-deploy` fixture;
      # see docs/FIXTURES.md. An unset GitHub secret above exports as "", which the fixture reports as
      # malformed rather than absent — read the estate report at the top of the run before trusting a
      # green result, because a skipped suite is not a passing one.
      PITHY_LIVE_DEPLOY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install

      # The loaders fall back to process.env, so the creds above are picked up with no .dev.vars file.
      # wrangler runs via `bun x wrangler` (the workspace devDependency) and authenticates from
      # CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID — no `wrangler login`.
      - name: Live integration tests
        run: bun run test:integration
