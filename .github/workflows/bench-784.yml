name: Bench 784

# Temporary, for #784 only: times tsc against bun check on a GitHub runner. Removed before the pull
# request merges.
on:
  push:
    branches: [feature/784-bun-check]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Machine
        run: nproc && free -g && uname -m

      - name: Per-program timing
        run: python3 -I .github/bench-784/bench.py "$PWD" "$(command -v bun)" 5 bench.json

      - name: Parity
        run: python3 -I .github/bench-784/parity.py "$PWD" "$(command -v bun)" parity.json

      - name: Whole task
        run: bash .github/bench-784/turbo_bench.sh "$PWD" 5 turbo.tsv

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-784
          path: |
            bench.json
            parity.json
            turbo.tsv
